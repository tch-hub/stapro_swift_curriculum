<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title description">
  <title id="title">ZStackの重ね合わせレイアウト</title>
  <desc id="description">半透明の青い四角形の上に半透明の赤い四角形、その上に白い「重ねる」という文字を表示した図</desc>
  <rect width="400" height="400" fill="white"/>
  <rect x="100" y="100" width="200" height="200" rx="4" fill="#007aff" fill-opacity="0.3"/>
  <rect x="125" y="125" width="150" height="150" rx="4" fill="#ff3b30" fill-opacity="0.5"/>
  <text x="200" y="212" text-anchor="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="30" font-weight="700">重ねる</text>
</svg>
